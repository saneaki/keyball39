name: Build a firmware

on:

  workflow_call:
    inputs:
      qmk_version:
        default: '0.31.8'
        type: string
        required: false
      keyboard:
        type: string
        required: true
      keymap:
        type: string
        required: true

jobs:

  build:

    name: Build a firmware ${{ inputs.keyboard }}:${{ inputs.keymap }}

    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/qmk/qmk_cli:latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4

    - name: Copy keyboard source to container QMK_HOME
      run: |
        echo "Using container default QMK_HOME: $QMK_HOME"
        ls -la $QMK_HOME/ || echo "QMK_HOME directory listing failed"
        mkdir -p $QMK_HOME/keyboards/
        cp -r qmk_firmware/keyboards/keyball $QMK_HOME/keyboards/keyball

    - name: Debug - List keyboard directory
      run: |
        echo "QMK_HOME=$QMK_HOME"
        ls -la $QMK_HOME/keyboards/keyball/
        ls -la $QMK_HOME/keyboards/keyball/${{ inputs.keyboard }}/
        qmk config || true

    - name: Compile and link
      run: qmk compile -j 4 -kb keyball/${{ inputs.keyboard }} -km ${{ inputs.keymap }}

    - name: Archive built firmware
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.keyboard }}-${{ inputs.keymap }}-firmware
        path: /qmk_firmware/*.hex
